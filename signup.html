<!DOCTYPE html>
<html lang="en">">
<head>
  <meta charset="UTF-8">
  <title>Create Account | DataMart</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      margin: 0;
      padding: 0;
    }
    .box {
      max-width: 400px;
      margin: 80px auto;
      background: #fff;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }
    input, button {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      box-sizing: border-box;
      border-radius: 5px;
      border: 1px solid #ddd;
    }
    input:focus {
      outline: none;
      border-color: #0077cc;
    }
    button {
      background: #0a7cff;
      color: #fff;
      border: none;
      font-size: 16px;
    }
    button:hover {
      background: #005bb5;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }
  </style>
</head>
<body>

<div class="box">
  <h2>Create Account</h2>

  <form onsubmit="redirectUser(event)">
    <label for="fullName">Full Name</label>
    <input type="text" id="fullName" name="fullName" placeholder="Full Name" required>
    
    <label for="email">Email Address</label>
    <input type="email" id="email" name="email" placeholder="Email Address" required pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$">
    
    <label for="phoneNumber">Phone Number</label>
    <input type="tel" id="phoneNumber" name="phoneNumber" placeholder="Phone Number" required>
    
    <label for="password">Password</label>
    <input type="password" id="password" name="password" placeholder="Password" required autocomplete="off">
    
    <button type="submit">Sign Up</button>
  </form>
</div>

<script>
  function redirectUser(event) {
    event.preventDefault();
    const confirmRedirect = confirm("Are you sure you want to proceed?");
    if (confirmRedirect) {
      setTimeout(() => {
        window.location.href = "https://www.cheapdata.shop/shop/amg-biznez-hub-1757507624120";
      }, 1000);
    }
  }
</script>

</body>
</html>
