<!DOCTYPE html>
<html>
<head>
  <title>Login | DataMart</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      margin: 0;
      padding: 0;
    }
    .box {
      max-width: 400px;
      margin: 80px auto;
      background: #fff;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
    }
    input, button {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      box-sizing: border-box;
      border-radius: 4px;
      border: 1px solid #ddd;
    }
    input:focus {
      outline: none;
      border-color: #666;
    }
    button {
      background: #111;
      color: #fff;
      border: none;
      cursor: pointer;
    }
    button:hover {
      background: #333;
      transition: background-color 0.3s;
    }
    .warning {
      color: red;
      font-size: 14px;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="box">
    <h2>Login</h2>
    <form id="loginForm" onsubmit="return goShop()">
      <input type="text" id="username" name="username" placeholder="Enter username" required>
      <p class="warning" id="warningMessage" style="display: none;">Please complete the form.</p>
      <button type="submit">Continue</button>
    </form>
  </div>

  <script>
    function goShop() {
      const username = document.getElementById('username').value;
      if (!username) {
        document.getElementById('warningMessage').style.display = 'block';
        return false;
      }
      window.location.href = "https://www.cheapdata.shop/shop/amg-biznez-hub-1757507624120";
      return false; // Optional: Prevent the form from actually submitting and just redirect.
    }
  </script>
</body>
</html>
