<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Reminder App</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      padding: 20px;
    }

    .app {
      max-width: 400px;
      margin: auto;
      background: #fff;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    h2 {
      text-align: center;
    }

    input, button {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
    }

    button {
      background: #0a7cff;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 16px;
    }

    ul {
      list-style: none;
      padding: 0;
    }

    li {
      background: #eee;
      padding: 10px;
      margin-top: 8px;
      border-radius: 5px;
      display: flex;
      justify-content: space-between;
    }

    .time {
      font-size: 12px;
      color: #555;
    }
  </style>
</head>
<body>

<div class="app">
  <h2>⏰ Reminder App</h2>

  <input type="text" id="text" placeholder="Reminder text">
  <input type="datetime-local" id="time">
  <button onclick="addReminder()">Add Reminder</button>

  <ul id="list"></ul>
</div>

<script>
  let reminders = JSON.parse(localStorage.getItem("reminders")) || [];

  function saveReminders() {
    localStorage.setItem("reminders", JSON.stringify(reminders));
  }

  function renderReminders() {
    const list = document.getElementById("list");
    list.innerHTML = "";

    reminders.forEach((r, index) => {
      const li = document.createElement("li");
      li.innerHTML = `
        <div>
          <strong>${r.text}</strong><br>
          <span class="time">${new Date(r.time).toLocaleString()}</span>
        </div>
        <button onclick="deleteReminder(${index})">❌</button>
      `;
      list.appendChild(li);
    });
  }

  function addReminder() {
    const text = document.getElementById("text").value;
    const time = document.getElementById("time").value;

    if (!text || !time) {
      alert("Please fill all fields");
      return;
    }

    reminders.push({ text, time, notified: false });
    saveReminders();
    renderReminders();

    document.getElementById("text").value = "";
    document.getElementById("time").value = "";
  }

  function deleteReminder(index) {
    reminders.splice(index, 1);
    saveReminders();
    renderReminders();
  }

  setInterval(() => {
    const now = new Date().getTime();

    reminders.forEach(r => {
      if (!r.notified && new Date(r.time).getTime() <= now) {
        alert("⏰ Reminder: " + r.text);
        r.notified = true;
        saveReminders();
      }
    });
  }, 1000);

  renderReminders();
</script>

</body>
</html>
