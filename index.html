<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Reminder App</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="manifest" href="manifest.json">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 20px;
    }
    .app {
      max-width: 400px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 12px;
    }
    input, button {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
    }
    button {
      background: #0a7cff;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
    }
    li {
      list-style: none;
      background: #eee;
      padding: 10px;
      margin-top: 8px;
      border-radius: 6px;
    }
  </style>
</head>
<body>

<div class="app">
  <h2>⏰ Reminder App</h2>

  <input id="text" placeholder="Reminder text">
  <input id="time" type="datetime-local">
  <button onclick="addReminder()">Add Reminder</button>

  <ul id="list"></ul>
</div>

<script>
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("service-worker.js");
  }

  let reminders = JSON.parse(localStorage.getItem("reminders")) || [];

  function save() {
    localStorage.setItem("reminders", JSON.stringify(reminders));
  }

  function render() {
    list.innerHTML = "";
    reminders.forEach((r, i) => {
      list.innerHTML += `
        <li>
          <b>${r.text}</b><br>
          ${new Date(r.time).toLocaleString()}
          <button onclick="remove(${i})">❌</button>
        </li>`;
    });
  }

  function addReminder() {
    const text = document.getElementById("text").value;
    const time = document.getElementById("time").value;
    if (!text || !time) return alert("Fill all fields");

    reminders.push({ text, time, done: false });
    save(); render();
  }

  function remove(i) {
    reminders.splice(i, 1);
    save(); render();
  }

  setInterval(() => {
    const now = Date.now();
    reminders.forEach(r => {
      if (!r.done && new Date(r.time).getTime() <= now) {
        alert("⏰ " + r.text);
        r.done = true;
        save();
      }
    });
  }, 1000);

  render();
</script>

</body>
</html>
